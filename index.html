<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VINAY PRIME AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#171717;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#f7f7f8;
  border-right:1px solid #e5e5e5;
  padding:14px;
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.logo{
  font-size:20px;
  font-weight:800;
  padding:12px 10px 18px;
}

.new-chat{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  font-size:15px;
  text-align:left;
}

.new-chat:hover{
  background:#eee;
}

.history{
  margin-top:20px;
  color:#777;
  font-size:13px;
}

.credit{
  margin-top:auto;
  border-top:1px solid #ddd;
  padding-top:14px;
  font-size:11px;
  line-height:1.8;
  color:#666;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:58px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:12px;
}

.menu{
  display:none;
  border:0;
  background:none;
  font-size:23px;
  cursor:pointer;
}

.title{
  font-weight:700;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 140px;
}

.welcome{
  max-width:700px;
  margin:14vh auto 0;
  text-align:center;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:#777;
}

.message{
  max-width:850px;
  margin:0 auto 25px;
  display:flex;
  gap:12px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:white;
  flex:none;
  font-size:13px;
  font-weight:bold;
}

.user .avatar{
  background:#ddd;
  color:#111;
}

.content{
  flex:1;
  line-height:1.6;
  font-size:15px;
  min-width:0;
}

.content img{
  max-width:280px;
  border-radius:12px;
  margin-top:8px;
  display:block;
}

pre{
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:10px;
  overflow-x:auto;
  margin:10px 0;
  position:relative;
}

code{
  font-family:Consolas,monospace;
}

.copy{
  margin-top:7px;
  border:1px solid #ccc;
  background:white;
  padding:5px 9px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

/* INPUT */
.input-area{
  position:fixed;
  bottom:0;
  left:260px;
  right:0;
  padding:15px 18px 20px;
  background:linear-gradient(transparent,#fff 30%);
}

.input-box{
  max-width:850px;
  margin:auto;
  border:1px solid #d5d5d5;
  border-radius:16px;
  background:#fff;
  box-shadow:0 3px 15px #00000012;
  padding:10px;
}

.preview{
  display:none;
  padding:5px 5px 10px;
}

.preview img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:9px;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  font-size:15px;
  min-height:40px;
  max-height:120px;
  padding:10px;
  font-family:inherit;
}

.icon-btn,
.send{
  width:40px;
  height:40px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn{
  background:#f1f1f1;
  font-size:20px;
}

.send{
  background:#111;
  color:white;
  font-size:18px;
}

.send:disabled{
  opacity:.4;
}

#file{
  display:none;
}

.typing{
  color:#888;
  font-style:italic;
}

/* MOBILE */
@media(max-width:700px){
  .sidebar{
    position:fixed;
    z-index:20;
    left:-270px;
    top:0;
    bottom:0;
    box-shadow:5px 0 20px #0002;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .input-area{
    left:0;
    padding:10px;
  }

  .messages{
    padding-top:18px;
  }

  .welcome h1{
    font-size:24px;
  }

  .message{
    gap:8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">✦ VINAY PRIME AI</div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history">
      Chats will appear here
    </div>

    <div class="credit">
      <b>DEVELOPER VINAY PRIME</b><br>
      MODERATOR SIDDHARTH<br>
      CUSTOMIZE BY YASH
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="menu" onclick="toggleMenu()">☰</button>
      <span class="title">VINAY PRIME AI</span>
    </header>

    <section class="messages" id="messages">

      <div class="welcome" id="welcome">
        <h1>How can I help you?</h1>
        <p>Ask anything or upload a photo for analysis.</p>
      </div>

    </section>

    <div class="input-area">

      <div class="input-box">

        <div class="preview" id="preview">
          <img id="previewImg">
        </div>

        <div class="controls">

          <label class="icon-btn" for="file" title="Upload photo">
            ＋
          </label>

          <input
            type="file"
            id="file"
            accept="image/*"
            onchange="previewImage(event)"
          >

          <textarea
            id="prompt"
            placeholder="Message VINAY PRIME AI..."
            rows="1"
            onkeydown="handleKey(event)"
          ></textarea>

          <button
            class="send"
            id="sendBtn"
            onclick="sendMessage()"
          >↑</button>

        </div>

      </div>

    </div>

  </main>

</div>

<script>

/* =========================================
   GEMINI API KEY
   PASTE YOUR KEY BETWEEN THE QUOTES
   ========================================= */

const API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";

/* Gemini model */
const MODEL = "gemini-2.5-flash";

let selectedImage = null;

const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");


/* ENTER TO SEND */
function handleKey(e){

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

}


/* MOBILE MENU */
function toggleMenu(){

  document.getElementById("sidebar")
    .classList.toggle("open");

}


/* IMAGE PREVIEW */
function previewImage(event){

  const file = event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("Please select an image.");
    return;
  }

  selectedImage = file;

  previewImg.src = URL.createObjectURL(file);

  preview.style.display = "block";

}


/* NEW CHAT */
function newChat(){

  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Ask anything or upload a photo for analysis.</p>
    </div>
  `;

  selectedImage = null;

  document.getElementById("file").value = "";

  preview.style.display = "none";

  promptBox.value = "";

}


/* ADD USER MESSAGE */
function addUserMessage(text, imageURL){

  const welcome = document.getElementById("welcome");

  if(welcome) welcome.remove();

  const div = document.createElement("div");

  div.className = "message user";

  let html = `
    <div class="avatar">U</div>
    <div class="content">
  `;

  if(imageURL){

    html += `<img src="${imageURL}">`;

  }

  if(text){

    html += `<div>${escapeHTML(text)}</div>`;

  }

  html += `</div>`;

  div.innerHTML = html;

  messages.appendChild(div);

  scrollBottom();

}


/* ADD AI MESSAGE */
function addAIMessage(text){

  const div = document.createElement("div");

  div.className = "message";

  div.innerHTML = `
    <div class="avatar">AI</div>
    <div class="content">${formatAnswer(text)}</div>
  `;

  messages.appendChild(div);

  scrollBottom();

}


/* TYPING MESSAGE */
function addTyping(){

  const div = document.createElement("div");

  div.id = "typing";

  div.className = "message";

  div.innerHTML = `
    <div class="avatar">AI</div>
    <div class="content typing">Thinking...</div>
  `;

  messages.appendChild(div);

  scrollBottom();

}


/* SEND MESSAGE */
async function sendMessage(){

  const text = promptBox.value.trim();

  if(!text && !selectedImage) return;

  if(
    !API_KEY ||
    API_KEY === "PASTE_YOUR_GEMINI_API_KEY_HERE"
  ){

    alert("First paste your Gemini API key in the API_KEY variable.");

    return;
  }


  sendBtn.disabled = true;

  const imageURL = selectedImage
    ? URL.createObjectURL(selectedImage)
    : null;

  addUserMessage(text, imageURL);

  const imageFile = selectedImage;

  promptBox.value = "";

  selectedImage = null;

  document.getElementById("file").value = "";

  preview.style.display = "none";

  addTyping();


  try{

    const parts = [];

    if(text){

      parts.push({
        text:text
      });

    }else{

      parts.push({
        text:"Analyze this image carefully and explain what you see. Answer the user's request clearly."
      });

    }


    /* IMAGE -> BASE64 */
    if(imageFile){

      const base64 = await fileToBase64(imageFile);

      parts.push({
        inline_data:{
          mime_type:imageFile.type,
          data:base64
        }
      });

    }


    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(API_KEY)}`,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          contents:[
            {
              role:"user",
              parts:parts
            }
          ],

          generationConfig:{
            temperature:0.7,
            maxOutputTokens:4096
          }

        })
      }
    );


    const data = await response.json();


    const typing = document.getElementById("typing");

    if(typing) typing.remove();


    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        "Gemini API request failed."
      );

    }


    const answer =
      data?.candidates?.[0]?.content?.parts
      ?.map(p => p.text || "")
      .join("")
      .trim();


    if(!answer){

      addAIMessage(
        "Sorry, mujhe response nahi mila. Please try again."
      );

    }else{

      addAIMessage(answer);

    }


  }catch(error){

    const typing = document.getElementById("typing");

    if(typing) typing.remove();

    addAIMessage(
      "❌ Error: " + error.message
    );

    console.error(error);

  }


  sendBtn.disabled = false;

}


/* FILE -> BASE64 */
function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = () => {

      const result = reader.result;

      const base64 =
        result.split(",")[1];

      resolve(base64);

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* FORMAT ANSWER */
function formatAnswer(text){

  let html = escapeHTML(text);


  /* CODE BLOCKS */
  html = html.replace(
    /```(?:[\w#+.-]+)?\n?([\s\S]*?)```/g,
    function(match, code){

      const cleanCode = code.trim();

      const id =
        "code_" +
        Math.random()
          .toString(36)
          .substring(2,9);

      return `
        <pre><code id="${id}">${cleanCode}</code></pre>
        <button class="copy"
          onclick="copyCode('${id}')">
          📋 Copy code
        </button>
      `;

    }
  );


  /* BOLD */
  html = html.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );


  /* LINE BREAK */
  html = html.replace(
    /\n/g,
    "<br>"
  );


  return html;

}


/* COPY CODE */
function copyCode(id){

  const code =
    document.getElementById(id);

  if(!code) return;

  navigator.clipboard.writeText(
    code.innerText
  ).then(()=>{

    alert("Code copied!");

  });

}


/* SECURITY */
function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SCROLL */
function scrollBottom(){

  messages.scrollTop =
    messages.scrollHeight;

}

</script>

</body>
      </html>
